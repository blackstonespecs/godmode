<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSA Shorts Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        video {
            max-width: 90vw;
            max-height: 90vh;
            background: #000;
        }
        
        .controls {
            margin-top: 20px;
            color: #fff;
            text-align: center;
        }
        
        .info {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        
        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="videoPlayer" controls></video>
        <div class="controls">
            <button onclick="previousVideo()">← Previous</button>
            <button onclick="pauseResume()" id="pauseBtn">Pause</button>
            <button onclick="nextVideo()">Next →</button>
        </div>
        <div class="info">
            <div id="videoInfo">Loading videos...</div>
            <div id="playlistInfo"></div>
        </div>
    </div>

    <script>
        let videos = [];
        let currentIndex = 0;
        let isAutoPlay = true;

        async function loadVideos() {
            try {
                const response = await fetch('https://api.github.com/repos/blackstonespecs/godmode/contents/shorts');
                const data = await response.json();

                videos = data
                    .filter(file => file.name.toLowerCase().endsWith('.mp4'))
                    .filter(file => {
                        const name = file.name.toLowerCase();
                        return name.startsWith('nsa') || name.startsWith('cyco');
                    })
                    .map(file => file.download_url)
                    .sort();

                if (videos.length === 0) {
                    document.getElementById('videoInfo').textContent = 'No nsa*.mp4 or cyco*.mp4 files found';
                    return;
                }

                console.log('Found videos:', videos);
                playVideo(0);
            } catch (error) {
                console.error('Error loading videos:', error);
                document.getElementById('videoInfo').textContent = 'Error loading videos: ' + error.message;
            }
        }

        function playVideo(index) {
            if (index < 0 || index >= videos.length) return;
            
            currentIndex = index;
            const video = document.getElementById('videoPlayer');
            video.src = videos[index];
            video.play().catch(err => console.log('Auto-play blocked:', err));
            
            updateInfo();
        }

        function updateInfo() {
            const videoName = videos[currentIndex].split('/').pop();
            document.getElementById('videoInfo').textContent = `Now playing: ${videoName}`;
            document.getElementById('playlistInfo').textContent = `${currentIndex + 1} / ${videos.length}`;
        }

        function nextVideo() {
            if (currentIndex < videos.length - 1) {
                playVideo(currentIndex + 1);
            }
        }

        function previousVideo() {
            if (currentIndex > 0) {
                playVideo(currentIndex - 1);
            }
        }

        function pauseResume() {
            const video = document.getElementById('videoPlayer');
            const btn = document.getElementById('pauseBtn');
            
            if (video.paused) {
                video.play();
                btn.textContent = 'Pause';
                isAutoPlay = true;
            } else {
                video.pause();
                btn.textContent = 'Resume';
                isAutoPlay = false;
            }
        }

        document.getElementById('videoPlayer').addEventListener('ended', () => {
            if (isAutoPlay && currentIndex < videos.length - 1) {
                nextVideo();
            }
        });

        loadVideos();
    </script>
</body>
</html>
